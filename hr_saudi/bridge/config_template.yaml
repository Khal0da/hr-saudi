server:
  url: "https://erp.yourcompany.com"
  api_key: "your_api_key"
  api_secret: "your_api_secret"
  timeout: 30
  retry_attempts: 3
  retry_delay: 60

devices:
  - name: "Main Gate"
    ip: "192.168.1.50"
    port: 4370
    sync_interval: 60
    timeout: 5

  - name: "Site A Entry"
    ip: "192.168.1.51"
    port: 4370
    sync_interval: 60
    timeout: 5

settings:
  batch_size: 100
  poll_interval: 60
  mapping_refresh_interval: 3600
  offline_mode: true
  duplicate_check: true
  log_level: INFO
  log_file: "bridge.log"
